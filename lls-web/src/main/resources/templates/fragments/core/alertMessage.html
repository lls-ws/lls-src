<div th:fragment="alertMessage" class="alert-fixed">

	<div id="alertMessage" role="alert" style="display: none;"
	     class="auto-close alert alert-danger alert-dismissible fade show">
		
		<div class="text-center text-break fs-6 d-flex align-items-center justify-content-center gap-2">
		
			<i class="fa-solid fa-ban fa-beat-fade fa-xl"></i>
			<span th:text="${alertMessage}" id="alertMessageText"></span>

		</div>
		
		<button type="button" class="btn-close btn-lg"
				data-bs-dismiss="alert" aria-label="Close"></button>
		
	</div>

</div>
