<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<th:block th:replace="~{fragments/core/title :: title}"></th:block>
	<th:block th:replace="~{fragments/core/bootstrap :: bootstrap}"></th:block>
	<th:block th:replace="~{fragments/core/jqueryLLS :: jqueryLLS}"></th:block>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/component/alertMessage :: alertMessage}"></div>
	
	<main th:with="id='Login'" class="form-signin text-center flex-shrink-0">
		
		<form th:id="form + ${id}" class="container">
		
			<div th:replace="~{fragments/login/imageLogin :: imageLogin(${id})}"></div>
			
			<div th:replace="~{fragments/login/titleLogin :: titleLogin(${id})}"></div>
			
			<div th:insert="~{fragments/component/inputEmail :: inputEmail}"
				 th:with="id=${id},required=true"></div>
			
			<div th:insert="~{fragments/component/inputPassword :: inputPassword}"
				 th:with="id=${id},required=true"></div>
			
			<button th:id="button + ${id}">
				<i th:id="imageButton + ${id}"></i>
			</button>
			
			<div class="mb-3"></div>
			
			<div th:replace="~{fragments/login/passwordForgot :: passwordForgot(${id})}"></div>
			
		</form>
	
		<script th:inline="javascript">

			$(document).ready(function(){

				loginForm({
					id: [[${id}]]
				});
				
			});

		</script>
	  
	</main>
    
    <!-- Links to change the locale -->
	<footer class="mt-auto py-3 bg-dark">
		<div class="container">
			<span class="text-muted">
				<a href="?lang=en">English</a>
				<a href="?lang=pt_BR">Brasil</a>
				<p th:text="${currentLocale}">Default Locale</p>
			</span>
		</div>
	</footer>
    
</body>

</html>
