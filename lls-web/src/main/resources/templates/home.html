<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" 
      xmlns:sec="http://thymeleaf.org/extras/spring-security"
      data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Offcanvas + Theme Switcher</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons (Para os ícones de Sol, Lua e Computador) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/bootstrap-icons.svg" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR FIXA NO TOPO (sticky-top) -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top border-bottom shadow-sm">
    <div class="container-fluid">
      
      <!-- Marca / Logo -->
      <a class="navbar-brand fw-bold text-primary" href="#">PainelApp</a>

      <!-- Botão Hambúrguer para Mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- MENU OFFCANVAS -->
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        
        <!-- Header do Offcanvas (Mobile) -->
        <div class="offcanvas-header border-bottom">
          <h5 class="offcanvas-title fw-bold" id="offcanvasNavbarLabel">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <!-- Corpo do Offcanvas -->
        <div class="offcanvas-body">
          <ul class="navbar-nav justify-content-start flex-grow-1 pe-3">
            <li class="nav-item">
              <a class="nav-link active" th:href="@{/home}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/produtos}">Produtos</a>
            </li>

            <!-- MENU EXCLUSIVO DO ADMINISTRADOR -->
            <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link dropdown-toggle text-danger fw-semibold" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Gerenciamento (Admin)
              </a>
              <ul class="dropdown-menu shadow-sm">
                <li><a class="dropdown-item" th:href="@{/admin/usuarios}">Controlar Usuários</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/relatorios}">Relatórios</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" th:href="@{/admin/config}">Configurações</a></li>
              </ul>
            </li>
          </ul>

          <!-- ÁREA DIREITA: Usuário Autenticado + Alternador de Tema -->
          <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center mt-3 mt-lg-0 gap-3">
            
            <!-- Info do Usuário -->
            <div class="text-muted small" sec:authorize="isAuthenticated()">
              Olá, <span class="fw-bold" sec:authentication="name">Usuário</span>! 
              <span class="badge bg-danger-subtle text-danger ms-1" sec:authorize="hasRole('ADMIN')">Admin</span>
            </div>
            
            <!-- Botão de Logout -->
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
              <button class="btn btn-sm btn-outline-secondary" type="submit">Sair</button>
            </form>

            <hr class="d-lg-none w-100 my-2"> <!-- Divisor visual apenas no mobile -->

            <!-- SELETOR MANUAL DE TEMA (Claro / Escuro / Auto) -->
            <div class="nav-item dropdown">
              <button class="btn btn-link nav-link dropdown-toggle d-flex align-items-center" id="bd-theme" type="button" aria-expanded="false" data-bs-toggle="dropdown" aria-label="Toggle theme (auto)">
                <i class="bi bi-circle-half theme-icon-active me-2"></i>
                <span class="d-lg-none">Alternar tema</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="bd-theme-text">
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="light" aria-pressed="true">
                    <i class="bi bi-sun-fill me-2"></i> Claro
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                    <i class="bi bi-moon-stars-fill me-2"></i> Escuro
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto" aria-pressed="false">
                    <i class="bi bi-circle-half me-2"></i> Automático
                  </button>
                </li>
              </ul>
            </div>

          </div> <!-- Fim Área Direita -->
          
        </div>
      </div>

    </div>
  </nav>

  <!-- Conteúdo de teste (Scroll longo para validar o sticky-top) -->
  <div class="container my-5" style="height: 2000px;">
    <h1 class="text-body-emphasis">Dashboard Principal</h1>
    <p class="lead">Altere o tema no botão superior direito. Use a rolagem de tela para ver o menu fixado.</p>
  </div>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SCRIPT OFICIAL DO BOOTSTRAP 5.3 PARA TROCA DE TEMAS -->
  <script>
    /*!
     * Color mode toggler for Bootstrap's docs (https://getbootstrap.com)
     * Copyright 2011-2024 The Bootstrap Authors
     * Licensed under the Creative Commons Attribution 3.0 Unported License.
     */
    (() => {
      'use strict'

      const getStoredTheme = () => localStorage.getItem('theme')
      const setStoredTheme = theme => localStorage.setItem('theme', theme)

      const getPreferredTheme = () => {
        const storedTheme = getStoredTheme()
        if (storedTheme) {
          return storedTheme
        }
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }

      const setTheme = theme => {
        if (theme === 'auto') {
          document.documentElement.setAttribute('data-bs-theme', (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))
        } else {
          document.documentElement.setAttribute('data-bs-theme', theme)
        }
      }

      setTheme(getPreferredTheme())

      const showActiveTheme = (theme, focus = false) => {
        const themeSwitcher = document.querySelector('#bd-theme')
        if (!themeSwitcher) return

        const activeThemeIcon = document.querySelector('.theme-icon-active')
        const btnToActive = document.querySelector(`[data-bs-theme-value="${theme}"]`)
        
        // Mapeamento de ícones dos botões
        const iconMap = {
          light: 'bi-sun-fill',
          dark: 'bi-moon-stars-fill',
          auto: 'bi-circle-half'
        }

        document.querySelectorAll('[data-bs-theme-value]').forEach(element => {
          element.classList.remove('active')
          element.setAttribute('aria-pressed', 'false')
        })

        btnToActive.classList.add('active')
        btnToActive.setAttribute('aria-pressed', 'true')
        
        // Atualiza o ícone principal do botão correspondente ao tema ativo
        activeThemeIcon.className = `bi ${iconMap[theme]} theme-icon-active me-2`

        if (focus) {
          themeSwitcher.focus()
        }
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const storedTheme = getStoredTheme()
        if (storedTheme !== 'light' && storedTheme !== 'dark') {
          setTheme(getPreferredTheme())
        }
      })

      window.addEventListener('DOMContentLoaded', () => {
        showActiveTheme(getPreferredTheme())

        document.querySelectorAll('[data-bs-theme-value]')
          .forEach(toggle => {
            toggle.addEventListener('click', () => {
              const theme = toggle.getAttribute('data-bs-theme-value')
              setStoredTheme(theme)
              setTheme(theme)
              showActiveTheme(theme, true)
            })
          })
      })
    })()
  </script>
</body>
</html>
